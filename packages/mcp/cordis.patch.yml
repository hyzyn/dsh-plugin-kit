# dsh-plugin-kit/mcp bundle patch：把本插件行插入 profile 阵容。
# 作为 profile bundle 层（package.json 的 dsh.bundle.patch 字段）叠加到
# dsh-base 之上；启用方式：
#   dsh plugin --profile web add link:$(pwd)/packages/mcp
# 行内容为按包名注册的裸插件行：exports "." 的 node 半体运行在宿主进程。
# 注意：同一 id 只能挂载一次——不要再把这行手工追加到
# ~/.dsh/cordis.patch.yml（home 补丁层），否则启动时报
# "duplicate loader entry id: mcp-config"（home 层只放 MCP 服务器托管区块）。
- insert:
    - id: mcp-config
      name: '@hyzyn/dsh-mcp'
