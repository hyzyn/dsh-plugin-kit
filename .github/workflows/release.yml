name: Release

on:
  push:
    tags: ['v*']

# 与 CI 成对的硬化（2026-10-03）：workflow 级先收到只读，写权限仍由 job 级
# contents: write 精确授予；发布组 cancel-in-progress: false——发布跑到一半不能被
# 取代（tag 是不可变锚点，打断只会留下半截状态）。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 历史实测 5–7 分钟；上限防挂死，不是预算。
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # workflow 笔误在 tag 上也拦一道（tag 可以打在没过 CI 的提交上）。
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # tag 锚点是 @hyzyn/dsh-all（用户视角的聚合包，沿用 v0.1.15 惯例），见 RELEASING.md
      - name: Verify tag matches @hyzyn/dsh-all version
        run: |
          PKG_VERSION="v$(node -p "require('./packages/all/package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 @hyzyn/dsh-all 版本 $PKG_VERSION 不一致"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - name: Check aggregate is up to date
        run: pnpm aggregate:check
      # 发布前最后一道闸：workspace: 残留只在 git 子路径安装时暴露（npm 产物因
      # publish 期转换看不出问题），一旦发出去只能靠发新版本补救
      - name: Check no workspace protocol in publishable deps
        run: pnpm publishable:check
      # 发布前最后一道闸：DSH peer 声明写错/写漏的后果在用户侧才暴露（插件被判定
      # incompatible-version 而装不上 / 启动即 disabled），发出去只能靠新版本补救
      - name: Check dsh peer compatibility declarations
        run: pnpm dsh-peers:check
      # 发布前最后一道闸：kit 的钉子漏跟一个包就会发出去（用户侧装得下，只是同一进程里
      # 两份 kit = 两套模块级单例 → kit D11 的授权不一致回来），发出去只能靠新版本补救
      - name: Check dsh-kit pins are uniform and aligned
        run: pnpm kit-pins:check
      # 挂载闸（2026-10-03，与 ci.yml 的 mount-smoke job 成对）：**发出去之前**证明这批包真的能
      # 在真 DSH 里挂起来、界面真的能渲染。为什么发布闸必须有它：tag 可以打在没过 CI 的提交上，
      # 而 npm 一旦发出去就只能靠发新版本补救——「只在 CI 补、发布路径照样绕过」正是 docker D119
      # 那次的形状（docs/conventions.md § 真机脚本与 CI 接线：CI 与发布闸要成对）。
      # 命令与 ci.yml **逐字一致**（守卫第 3 条要求两侧同一条目命令相同）。
      - name: Install dsh CLI (pinned)
        run: npm install -g @deepseek-ai/dsh@0.2.1-alpha.1
      - name: Mount + headless render smoke
        run: pnpm live-smoke --bootstrap --strict --render --chrome-arg --no-sandbox
      # 发布前最后一档：CI 会跑这些，但 tag 可以打在没过 CI 的提交上，发布闸自己也要
      # 挡一次（docker DEFECTS D119：此前只有 CI 补了这套脚本，发布路径仍能整条绕过）
      # 调包内条目（唯一真相源 `package.json`）——CI 那侧同步收敛，见 docs/ci-scripts-plan.md。
      - name: Test (repo vitest + dsh-docker smoke scripts)
        run: |
          pnpm test
          pnpm --filter @hyzyn/dsh-docker run smoke
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            # 这里必须红，不能 ::warning:: + exit 0：后面的 Create GitHub release 照跑，
            # 于是留下一个「workflow 全绿、包一个都没发上 npm、却建了 Release 页」的假成功
            # ——绿条里的假成功比红条难发现得多。补 secret（RELEASING.md「一次性配置」）
            # 后重跑同一个 tag 即可，发布是幂等的。
            echo "::error::NPM_TOKEN secret 未配置，发布中止；配置方法见 RELEASING.md「一次性配置」"
            exit 1
          fi
          # token 明文写入 runner 的 ~/.npmrc 后由 pnpm publish 读取；
          # ${VAR} 占位符在 pnpm publish 下解析不可靠（会拿错凭证 → 403/404 乱象），不用
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
          pnpm release:publish
      - name: Create GitHub release
        env:
          # 优先用仓库 secret `GH_TOKEN`（PAT），缺失或过期时回落到内置 github.token：
          # 建 Release 本身内置 token 就够（需要仓库 Settings → Actions → Workflow
          # permissions 为 Read and write），PAT 只在「只有它才能做」的事上才必要
          # （越过规则集、触发下游 workflow、跨仓库操作）。用 `||` 而非直接替换，
          # 是为了避免 secret 未配置时这一步直接失败。
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          # 重跑/删 tag 重打的残留：同 tag 的 draft 不删会堆在 Release 列表里（v0.1.19/v0.1.20 教训）
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft and .tag_name == "'"$GITHUB_REF_NAME"'") | .id' \
            | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done || true
          PREV=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)
          RANGE="${PREV:+${PREV}..}HEAD"
          {
            echo "## Highlights"
            echo
            # 只列用户可见改动，两道过滤：
            #   1) 类型：chore/docs/test/ci/build/style/refactor 一律不列
            #      （必须带 scope 一起匹配，"chore(deps):" 才算滤掉）
            #   2) scope：内部维护范围（ci/deps/release/repo/tooling）不列
            NOTES=$(git log "$RANGE" --format='- %s' \
              | grep -vE '^- (chore|docs|test|ci|build|style|refactor)(\([^)]*\))?!?:' \
              | grep -vE '^- [a-z]+(\((ci|deps|release|repo|tooling)\))!?:' || true)
            if [ -n "$NOTES" ]; then
              printf '%s\n' "$NOTES"
            else
              echo "- 内部维护发布（无用户可见改动）"
            fi
            echo
            echo "## 包版本"
            echo
            # 全部 workspace 包的发布清单：Highlights 只列提交主题，bump 矩阵在这里给全量视图
            for f in packages/*/package.json; do
              node -p "const p = require('./$f'); '- ' + p.name + ' ' + p.version" 2>/dev/null
            done | sort
            node -p "'- ' + require('./package.json').name + ' ' + require('./package.json').version"
            echo
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md
          ALL_VERSION=$(node -p "require('./packages/all/package.json').version")
          EXTRA=""
          case "$ALL_VERSION" in *-*) EXTRA="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $EXTRA --notes-file release-notes.md \
            || gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $EXTRA --notes-file release-notes.md \
            || true
