name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # tag 锚点是 @hyzyn/dsh-all（用户视角的聚合包，沿用 v0.1.15 惯例），见 RELEASING.md
      - name: Verify tag matches @hyzyn/dsh-all version
        run: |
          PKG_VERSION="v$(node -p "require('./packages/all/package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 @hyzyn/dsh-all 版本 $PKG_VERSION 不一致"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - name: Check aggregate is up to date
        run: |
          pnpm aggregate
          git diff --exit-code -- cordis.patch.yml package.json packages/all/cordis.patch.yml packages/all/package.json \
            || { echo "::error::聚合层过期：在本地跑 pnpm aggregate 后重新提交"; exit 1; }
      # 发布前最后一道闸：workspace: 残留只在 git 子路径安装时暴露（npm 产物因
      # publish 期转换看不出问题），一旦发出去只能靠发新版本补救
      - name: Check no workspace protocol in publishable deps
        run: node scripts/check-publishable.mjs
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret 未配置；跳过 npm publish（手动发布见 RELEASING.md）"
            exit 0
          fi
          # token 明文写入 runner 的 ~/.npmrc 后由 pnpm publish 读取；
          # ${VAR} 占位符在 pnpm publish 下解析不可靠（会拿错凭证 → 403/404 乱象），不用
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
          node scripts/release-publish-tag.mjs
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)
          RANGE="${PREV:+${PREV}..}HEAD"
          {
            echo "## Highlights"
            echo
            # 只列用户可见改动，两道过滤：
            #   1) 类型：chore/docs/test/ci/build/style/refactor 一律不列
            #      （必须带 scope 一起匹配，"chore(deps):" 才算滤掉）
            #   2) scope：内部维护范围（ci/deps/release/repo/tooling）不列
            NOTES=$(git log "$RANGE" --format='- %s' \
              | grep -vE '^- (chore|docs|test|ci|build|style|refactor)(\([^)]*\))?!?:' \
              | grep -vE '^- [a-z]+(\((ci|deps|release|repo|tooling)\))!?:' || true)
            if [ -n "$NOTES" ]; then
              printf '%s\n' "$NOTES"
            else
              echo "- 内部维护发布（无用户可见改动）"
            fi
            echo
            echo "## 包版本"
            echo
            # 全部 workspace 包的发布清单：Highlights 只列提交主题，bump 矩阵在这里给全量视图
            for f in packages/*/package.json; do
              node -p "const p = require('./$f'); '- ' + p.name + ' ' + p.version" 2>/dev/null
            done | sort
            node -p "'- ' + require('./package.json').name + ' ' + require('./package.json').version"
            echo
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md
          ALL_VERSION=$(node -p "require('./packages/all/package.json').version")
          EXTRA=""
          case "$ALL_VERSION" in *-*) EXTRA="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $EXTRA --notes-file release-notes.md \
            || gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $EXTRA --notes-file release-notes.md \
            || true
