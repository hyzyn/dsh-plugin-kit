name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：用于在不动 main、也不开 PR 的分支上跑矩阵（workflow_dispatch 必须先
  # 存在于默认分支才可调用，所以它随本文件一起进 main 之后才生效）。
  # test_filter 留空 = 跑全量 pnpm test；填路径/文件名 = 只跑那部分（例如
  # packages/codegraph/test/cli-route.test.ts，Windows 上的 shim spawn 用例）。
  workflow_dispatch:
    inputs:
      test_filter:
        description: '可选的 vitest 过滤（路径或文件名片段），留空跑全量'
        required: false
        default: ''

jobs:
  build:
    # 三平台矩阵：插件里存在平台分支（Windows 经 cmd.exe 调 CLI shim、taskkill 收进程树、
    # 补丁文件行尾），而这里历史上唯一的 Windows 事故（spawn codegraph ENOENT）就是
    # 「CI 只跑 ubuntu + 该路径在 Windows 上被跳过」漏掉的。构建 / 类型 / 测试三平台都跑。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      # shell 显式指定 bash：三个 runner 上都有，免得 Windows 默认走 pwsh 而分叉行为
      - name: Test
        shell: bash
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npx vitest run "$TEST_FILTER"
          else
            pnpm test
          fi
      # 下面三项是发布不变量检查，只跟仓库内容有关、与运行平台无关：留在 Linux 跑一次，
      # 免得 Windows 的 shell / 行尾差异造成假红（发布 workflow 也是 ubuntu）。
      # 聚合层必须与各包的插件声明一致：有 diff 说明提交时忘了 pnpm aggregate
      - name: Check aggregate is up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm aggregate
          git diff --exit-code -- cordis.patch.yml package.json packages/all/cordis.patch.yml packages/all/package.json \
            || { echo "::error::聚合层过期：在本地跑 pnpm aggregate 后重新提交"; exit 1; }
      # 防回归：workspace: 协议残留会让消费者从 git 子路径安装时直接失败
      # （ERR_PNPM_WORKSPACE_PKG_NOT_FOUND），而 npm 产物因 publish 期转换看不出问题
      - name: Check no workspace protocol in publishable deps
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/check-publishable.mjs
      # 防回归：每个可安装插件必须声明 dsh.engines.dsh，且只能是 dsh-web 解析器支持的
      # `>=X.Y.Z[-rc.N]` 一种形式——写成 ^ / ~ / 两段式会被判为「无法验证」而 fail-closed
      # （更新被直接拦下），比不声明更糟
      - name: Check dsh.engines.dsh declarations
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/check-dsh-engines.mjs
      # 防回归：DSH_HOME 的推导（~ 展开 + resolve）只允许在 kit 里有一份；插件各写
      # 各的 raw 副本会在 DSH_HOME=~/x 时写/读不同的配置目录（codegraph DEFECTS CG35）
      - name: Check DSH_HOME derivation lives only in kit
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/check-dsh-home.mjs
      # 防回归：入库产物必须与源码一致——曾发生过源码改了、产物没重建，修复在浏览器侧
      # 完全无效。重建后对全部包的浏览器半体（client.js）与宿主半体（lib/）做 diff。
      - name: Check build artifacts are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm -r build
          git diff --exit-code -- 'packages/*/client.js' 'packages/*/lib' || { echo "::error::构建产物落后于源码：在本地跑 pnpm -r build 后重新提交"; exit 1; }
      # 旗舰端到端脚本（自包含：内存 sshd / 本机 PTY，不依赖真实外部主机）。
      # 此前完全不在 CI 里跑，SFTP / SSH 生命周期 / 工具路由的回归静默通过。
      - name: dsh-tty end-to-end scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          node packages/tty/scripts/integration.mjs
          node packages/tty/scripts/ssh-smoke.mjs
          node packages/tty/scripts/probe-smoke.mjs
          node packages/tty/scripts/probe-route-smoke.mjs
          node packages/tty/scripts/sftplimits-smoke.mjs
      # dsh-docker 的三套端到端脚本（docker DEFECTS D70）：解析 / 路由 / 浏览器半体
      # 此前只在本机手跑，client.js 在 CI 里从未被执行过。三套都已 hermetic
      # （假 ctx + 假 docker CLI + 127.0.0.1:1 立即拒绝连接，见 docker D25）且带看门狗（D71）。
      - name: dsh-docker smoke scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          node packages/docker/scripts/smoke.mjs
          node packages/docker/scripts/route-smoke.mjs
          node packages/docker/scripts/client-smoke.mjs
      # Windows 端到端（DEFECTS D45 的最后一格）：真实 cmd.exe / ConPTY 的
      # spawn → ready → 输入回显 → kill → 重开。脚本在非 Windows 上自行跳过，
      # 所以只在这个 job 上有意义（integration.mjs 的 POSIX 用例在 Windows 上不适用）。
      - name: dsh-tty Windows smoke
        if: matrix.os == 'windows-latest'
        run: node packages/tty/scripts/windows-smoke.mjs
