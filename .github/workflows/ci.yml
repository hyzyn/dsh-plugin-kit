name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：用于在不动 main、也不开 PR 的分支上跑矩阵（workflow_dispatch 必须先
  # 存在于默认分支才可调用，所以它随本文件一起进 main 之后才生效）。
  # test_filter 留空 = 跑全量 pnpm test；填路径/文件名 = 只跑那部分（例如
  # packages/codegraph/test/cli-route.test.ts，Windows 上的 shim spawn 用例）。
  workflow_dispatch:
    inputs:
      test_filter:
        description: '可选的 vitest 过滤（路径或文件名片段），留空跑全量'
        required: false
        default: ''

# 最小权限：CI 只需要读代码、跑测试；写权限只在真正需要处声明（release.yml 的 job 级
# contents: write）。默认全开权限时，任何被注入的 step 都能拿到写令牌。
permissions:
  contents: read

# 同一 PR / 同一 ref 的新推送取代在跑的一轮：上一轮已经全绿还被排队，纯粹烧 runner 分钟。
# 组键取 PR 号（PR 场景）或 ref（push / 手动场景）。release.yml 的同名组刻意
# cancel-in-progress: false——发布跑到一半不能被打断。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 三平台矩阵：插件里存在平台分支（Windows 经 cmd.exe 调 CLI shim、taskkill 收进程树、
    # 补丁文件行尾），而这里历史上唯一的 Windows 事故（spawn codegraph ENOENT）就是
    # 「CI 只跑 ubuntu + 该路径在 Windows 上被跳过」漏掉的。构建 / 类型 / 测试三平台都跑。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # 全 job 实测 1.5–3.5 分钟；这个上限是防挂死（网络假死、runner 卡住），不是时间预算。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # workflow 自身的 lint：YAML / 表达式写错只有在运行时才暴露，而改错闸门是静默的
      # （conventions「改 .github/ 是共享状态」）。容器 action 只支持 Linux runner，故只挂 ubuntu 腿。
      - name: Lint GitHub Actions workflows
        if: matrix.os == 'ubuntu-latest'
        uses: docker://rhysd/actionlint:latest
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      # shell 显式指定 bash：三个 runner 上都有，免得 Windows 默认走 pwsh 而分叉行为
      - name: Test
        shell: bash
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npx vitest run "$TEST_FILTER"
          else
            pnpm test
          fi
      # 下面三项是发布不变量检查，只跟仓库内容有关、与运行平台无关：留在 Linux 跑一次，
      # 免得 Windows 的 shell / 行尾差异造成假红（发布 workflow 也是 ubuntu）。
      # ── 发布不变量闸（9 道）─────────────────────────────────────────────────
      # 全部经根 package.json 的条目调用（`pnpm <条目>`）：条目是唯一真相源，也是
      # `pnpm run <条目>` 那个可粘贴入口——workflow 不许写死 `node scripts/…` 路径、
      # 条目不许漂，由 scripts/ci-script-truth.mjs 守卫（2026-10-03 起含根级规则，
      # 方案与执行记录见 docs/ci-scripts-plan.md § 10）。
      #
      # 聚合层必须与各包的插件声明一致：有 diff 说明提交时忘了 pnpm aggregate
      - name: Check aggregate is up to date
        if: matrix.os == 'ubuntu-latest'
        run: pnpm aggregate:check
      # 防回归：workspace: 协议残留会让消费者从 git 子路径安装时直接失败
      # （ERR_PNPM_WORKSPACE_PKG_NOT_FOUND），而 npm 产物因 publish 期转换看不出问题
      - name: Check no workspace protocol in publishable deps
        if: matrix.os == 'ubuntu-latest'
        run: pnpm publishable:check
      # 防回归：每个可安装插件必须用 peerDependencies 声明与当前 cohort 一致的
      # @deepseek-ai/dsh 范围。DSH 0.1.7-rc.1 起安装前/启动时的兼容性判定只看 peer
      # （预发布参与匹配），engines.dsh 不再有任何读取方；声明错了用户侧才暴露
      - name: Check dsh peer compatibility declarations
        if: matrix.os == 'ubuntu-latest'
        run: pnpm dsh-peers:check
      # 防回归：DSH_HOME 的推导（~ 展开 + resolve）只允许在 kit 里有一份；插件各写
      # 各的 raw 副本会在 DSH_HOME=~/x 时写/读不同的配置目录（codegraph DEFECTS CG35）
      - name: Check DSH_HOME derivation lives only in kit
        if: matrix.os == 'ubuntu-latest'
        run: pnpm dsh-home:check
      # 防回归：@hyzyn/dsh-kit 的钉子必须在全仓一致、精确、且等于 packages/kit 的版本。
      # kit 的跨插件一致性（授权存储 / 能力绑定，kit D11）靠**模块级单例**，而 pnpm 的
      # hoisted 布局只能把一个版本提升到顶层、另一个嵌进消费者自己的 node_modules
      # → 同一进程两份 kit = 两套单例，D11 的症状回来（一个卡片授了权、另一个仍报未授权）。
      # 2026-09-27 的真机报告里树上就同时躺着两份（.modules.yaml 的 hoistedLocations 各占一行）
      - name: Check dsh-kit pins are uniform and aligned
        if: matrix.os == 'ubuntu-latest'
        run: pnpm kit-pins:check
      # 防回归：全仓 markdown 的相对链接要命中真实文件、锚点要命中真实标题。
      # 三层文档改造那几轮里这类问题真实发生过三次（死锚点 / 自指链接 / 搬家后少一级），
      # 而没有一次是测试发现的——仓库里唯一的文档耦合测试只读 codegraph 自己的两份文档。
      - name: Check doc links and anchors
        if: matrix.os == 'ubuntu-latest'
        run: pnpm doc-links:check
      # 防回归：.github/ISSUE_TEMPLATE 的表单一旦 schema 破（重复 id / label 撞车 / 缩进错），
      # GitHub 只是在 issue 选择器里**不显示这张表**——没有任何东西会红；表单里指向仓库文档的
      # 链接同理（check-doc-links 只扫 markdown，不扫 yml）；config.yml 被删或
      # blank_issues_enabled 被改回，空白 issue 入口会悄悄回来。自检先跑（判据被改坏比没有闸门更糟）。
      - name: Check issue forms
        if: matrix.os == 'ubuntu-latest'
        run: pnpm issue-forms:check
      # 防回归：面板端 i18n 的目录（zh/en）必须键集一致、占位符一致，且代码里 t('…')
      # 用到的键全都有定义——第三条是主要理由：写错一个字母只会让界面露出键名，
      # 没有任何测试会红。自检先跑（闸门自身的判据也要有反例）。
      - name: Check panel i18n catalogs
        if: matrix.os == 'ubuntu-latest'
        run: pnpm i18n:check
      # 防回归：仓库里不得出现公网 IP（文件内容 + 提交信息）。钩子拦本地提交，CI 再兜一道
      # ——`git commit --no-verify`、用别的工具提交、或在别的机器上提交都能绕过钩子，而历史
      # 一旦脏了只能重写（所有 sha 变化 + 文档引用失效 + 远端 force push）。
      # 自检先跑：闸门自身的分类器被改坏（假阳性暴增 → 人人 --no-verify）比没有闸更糟。
      - name: Check no public IP addresses
        if: matrix.os == 'ubuntu-latest'
        run: pnpm no-public-ip:check
      - name: Check commit messages carry no public IP
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 只查本次推送 / PR 新增的提交信息（历史不再重复扫描，这里防新增）
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.sha }}'
          if [ -z "$base" ]; then base='${{ github.event.before }}'; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "无法确定比较基线（首次推送 / 新分支），跳过提交信息检查"
            exit 0
          fi
          for sha in $(git rev-list "$base..$head"); do
            msg_file=$(mktemp)
            git log -1 --format=%B "$sha" > "$msg_file"
            if ! pnpm no-public-ip:message --message-file "$msg_file"; then
              rm -f "$msg_file"
              echo "::error::提交 $sha 的信息含公网 IP"
              exit 1
            fi
            rm -f "$msg_file"
          done
          echo "提交信息检查通过（$base..$head）"
      # 防回归：入库产物必须与源码一致——曾发生过源码改了、产物没重建，修复在浏览器侧
      # 完全无效。重建后对全部包的浏览器半体（client.js）与宿主半体（lib/）做 diff。
      # ⚠️ lib/ 那半边**必须**用 ':(glob)…/**'：默认 pathspec 下 `*` 不递归目录内容，写
      # 'packages/*/lib' 会命中 0 个文件、闸门恒绿（2026-09-25 实测并修，详见
      # docs/conventions.md § 真机脚本与 CI 接线）。也不要图省事写 'packages/*/lib/**'
      # ——默认 pathspec 下 `*` 会跨 `/`，会多匹配 packages/tty/scripts/lib/test-sshd.mjs。
      - name: Check build artifacts are up to date
        if: matrix.os == 'ubuntu-latest'
        run: pnpm artifacts:check
      # 旗舰端到端脚本（自包含：内存 sshd / 本机 PTY，不依赖真实外部主机）。
      # 此前完全不在 CI 里跑，SFTP / SSH 生命周期 / 工具路由的回归静默通过。
      #
      # 调**包内条目**而不是写死路径：这样「哪个脚本叫什么」只剩 `package.json` 一个真相源
      # （写死路径时，改脚本名会红 CI、却让 `pnpm --filter … run <条目>` 那个可粘贴入口悄悄烂掉；
      # 反过来只改条目名则 CI 照样绿）。逐条对应关系与验收见 docs/ci-scripts-plan.md。
      - name: dsh-tty end-to-end scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm --filter @hyzyn/dsh-tty run integration
          pnpm --filter @hyzyn/dsh-tty run ssh-smoke
          pnpm --filter @hyzyn/dsh-tty run probe-smoke
          pnpm --filter @hyzyn/dsh-tty run probe-route-smoke
          pnpm --filter @hyzyn/dsh-tty run jump-smoke
          pnpm --filter @hyzyn/dsh-tty run proxycommand-smoke
          pnpm --filter @hyzyn/dsh-tty run sftplimits-smoke
      # dsh-docker 的三套端到端脚本（docker DEFECTS D70）：解析 / 路由 / 浏览器半体
      # 此前只在本机手跑，client.js 在 CI 里从未被执行过。三套都已 hermetic
      # （假 ctx + 假 docker CLI + 127.0.0.1:1 立即拒绝连接，见 docker D25）且带看门狗（docker D71）。
      # 三条并成包内的一条 `smoke`（`package.json` 里就是这三条 `&&` 串联，逐字等价）。
      - name: dsh-docker smoke scripts
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @hyzyn/dsh-docker run smoke
      # Windows 端到端（tty DEFECTS D45 的最后一格）：真实 cmd.exe / ConPTY 的
      # spawn → ready → 输入回显 → kill → 重开。脚本在非 Windows 上自行跳过，
      # 所以只在这个 job 上有意义（integration.mjs 的 POSIX 用例在 Windows 上不适用）。
      - name: dsh-tty Windows smoke
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @hyzyn/dsh-tty run windows-smoke

  # mount 车道（P2，2026-10-03）：把本 checkout 的插件**真的挂进一个真 DSH**，起宿主跑完
  # 授权阶梯，再用无头浏览器打开界面证明 client.js 真能跑起来。
  #
  # 为什么必须有它：上面 build 那个 job 的 9 道闸门全在回答「这棵树自洽吗」，没有一道会去
  # **加载** client.js——而 client.js 才是用户实际运行的东西（vitest.config.ts 写着「打包后的
  # client.js 不在本层测」，留在里面的逻辑等于没有测试入口，tty D61 就是这么漏掉的）。
  # 「构建绿 + 单测绿 + 用户白屏」这类失败，本仓此前在 CI 里完全不可见。
  #
  # 为什么单独一个 ubuntu-only job（而不是塞进上面的矩阵）：它要装真 DSH、起真宿主、开真
  # 浏览器，是**真机验收**，与三平台矩阵的性质不同；也要避免把它的重依赖带进 Windows/macOS 腿。
  #
  # 三块积木都是现成的：`--bootstrap`（干净环境现场造 profile，见 live-profile.mjs）、
  # `--render`（复用 chrome-cdp.mjs 的零依赖 CDP 客户端）、`--strict`（没装 DSH 从 SKIP 变红）。
  mount-smoke:
    name: Mount + headless render (real DSH)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pin 住要挂进去的 DSH 版本：它与根 package.json 的 peer 范围同档，升 cohort 时一起改。
      # 装不上（或版本与 cohort 不匹配）时 `--bootstrap` 会**自证失败**并把原因打出来——不会假绿。
      - name: Install dsh CLI (pinned)
        run: npm install -g @deepseek-ai/dsh@0.2.1-alpha.1
      # 挂载走 link:，用的是本 checkout 的包，所以先构建出 lib/ 与 client.js。
      - run: pnpm -r build
      # `--no-sandbox`：受限环境（容器化 runner / 文件沙箱）里 Chrome 自己的 sandbox 起不来，
      # CDP 只会报「超时」而指不到原因（本机沙箱实测：不带必超时，带了 5/5 全绿）。
      # `--strict`：没装 DSH 时不再是「打印 SKIP 然后退 0」——那是「假装验过」最典型的样子。
      - name: Mount + headless render smoke
        run: pnpm live-smoke --bootstrap --strict --render --chrome-arg --no-sandbox
